name: Content Compliance Gate

# Re-runs the research-use-only compliance gate on every push and PR.
# This is the backstop: even if the local gate is skipped, non-compliant
# content cannot merge. No secrets required.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run compliance gate + rebuild content
        # build.js renders every article, runs the fail-closed gate, and
        # regenerates blog/index.html, sitemap.xml and robots.txt.
        run: node content-engine/build.js

      - name: Fail if generated output is out of sync with source
        # If a committed article was changed without rebuilding, the working
        # tree will now differ from what was committed. That is a drift error.
        run: |
          if ! git diff --exit-code -- blog sitemap.xml robots.txt; then
            echo "::error::Generated content is out of sync. Run 'node content-engine/build.js' and commit the result."
            exit 1
          fi

      - name: Independent gate on shipped HTML
        # Final defence-in-depth: lint every blog page that will actually ship,
        # including any hand-edited HTML, not just the engine output.
        run: node content-engine/compliance.js blog/*.html
