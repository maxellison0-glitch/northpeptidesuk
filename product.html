<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | North Peptides UK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="product-data.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, sans-serif; background: #F8F9FA; color: #1a1a1a; }
    a { color: inherit; }
    .nav { height: 62px; padding: 0 40px; background: #101010; color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .logo { font-family: Syne, sans-serif; font-weight: 800; font-size: 1rem; letter-spacing: 0.08em; text-decoration: none; }
    .logo span { color: #00A67E; }
    .nav-links { display: flex; align-items: center; gap: 18px; font-family: "DM Mono", monospace; font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .nav-links a { color: rgba(255,255,255,0.75); text-decoration: none; }
    .nav-links a:hover { color: #fff; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 42px 40px 70px; }
    .back { display: inline-block; margin-bottom: 24px; font-family: "DM Mono", monospace; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: #6B7280; text-decoration: none; }
    .grid { display: grid; grid-template-columns: minmax(300px, 0.9fr) minmax(360px, 1.1fr); gap: 38px; align-items: start; }
    .image-panel { background: #fff; border: 1px solid #E5E7EB; border-radius: 10px; overflow: hidden; }
    .image-panel img { width: 100%; aspect-ratio: 1; display: block; object-fit: cover; background: #F3F4F6; }
    .info-panel { background: #fff; border: 1px solid #E5E7EB; border-radius: 10px; padding: 28px; }
    .tag { font-family: "DM Mono", monospace; font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: #00A67E; margin-bottom: 12px; }
    h1 { font-family: Syne, sans-serif; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1; margin-bottom: 14px; }
    .summary { color: #4B5563; line-height: 1.7; max-width: 620px; margin-bottom: 22px; }
    .trust-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .trust-chip { border: 1px solid #DADDE2; background: #F8F9FA; border-radius: 999px; padding: 7px 11px; font-family: "DM Mono", monospace; font-size: 0.58rem; letter-spacing: 0.06em; text-transform: uppercase; color: #565548; }
    .details { margin: 0 0 24px; padding-left: 18px; color: #4B5563; line-height: 1.8; font-size: 0.9rem; }
    .buy-box { border-top: 1px solid #E5E7EB; padding-top: 22px; }
    label { display: block; font-family: "DM Mono", monospace; font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: #6B7280; margin-bottom: 8px; }
    select { width: 100%; min-height: 46px; border: 1px solid #DADDE2; border-radius: 7px; background: #F8F9FA; color: #1a1a1a; padding: 0 13px; font: 500 0.85rem "DM Mono", monospace; margin-bottom: 18px; }
    .price-row { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 18px; }
    .price-label { font-family: "DM Mono", monospace; font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: #9CA3AF; }
    .price { font-family: Syne, sans-serif; font-size: 2rem; font-weight: 800; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button, .button { border: 0; border-radius: 7px; min-height: 48px; padding: 0 16px; cursor: pointer; font-family: "DM Mono", monospace; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
    .primary { background: #1a1a1a; color: #fff; }
    .primary:hover { background: #00A67E; }
    .stripe { background: #635BFF; color: #fff; }
    .stripe.disabled { background: #E5E7EB; color: #6B7280; cursor: default; pointer-events: none; }
    .note { margin-top: 12px; font-size: 0.76rem; color: #6B7280; line-height: 1.6; }
    .research-box { margin-top: 24px; border: 1px solid #DADDE2; border-radius: 8px; padding: 15px; background: #fff; color: #4B5563; font-size: 0.78rem; line-height: 1.7; }
    .missing { max-width: 680px; margin: 80px auto; text-align: center; background: #fff; border: 1px solid #E5E7EB; border-radius: 10px; padding: 34px; }
    .missing h1 { font-size: 2rem; }
    @media (max-width: 760px) {
      .nav { padding: 0 18px; }
      .nav-links { gap: 10px; font-size: 0.56rem; }
      .wrap { padding: 28px 16px 52px; }
      .grid { grid-template-columns: 1fr; gap: 18px; }
      .info-panel { padding: 20px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="logo">NORTH<span>PEPTIDES</span>UK</a>
    <div class="nav-links">
      <a href="index.html#products">Shop</a>
      <a href="checkout.html">Checkout</a>
      <a href="mailto:support@northpeptidesuk.com">Support</a>
    </div>
  </nav>

  <main class="wrap" id="app"></main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("product") || "retatrutide";
    const product = PRODUCT_DATA[slug];
    const app = document.getElementById("app");

    function money(value) {
      return "£" + value;
    }

    function getBasket() {
      try {
        return JSON.parse(sessionStorage.getItem("npuk_basket") || "[]");
      } catch {
        return [];
      }
    }

    function saveBasket(basket) {
      sessionStorage.setItem("npuk_basket", JSON.stringify(basket));
    }

    function selectedVariant() {
      const select = document.getElementById("variant");
      return product.variants[Number(select.value)];
    }

    function updatePrice() {
      document.getElementById("price").textContent = money(selectedVariant().price);
    }

    function addDetailToBasket(goCheckout = false) {
      const variant = selectedVariant();
      const basket = getBasket();
      const existing = basket.find(item => item.name === product.name && item.dose === variant.dose);
      if (existing) {
        existing.qty += 1;
      } else {
        basket.push({ name: product.name, price: variant.price, dose: variant.dose, qty: 1 });
      }
      saveBasket(basket);
      if (goCheckout) {
        window.location.href = "checkout.html";
        return;
      }
      const button = document.getElementById("add-button");
      button.textContent = "Added";
      setTimeout(() => { button.textContent = "Add to Basket"; }, 1200);
    }

    function renderMissing() {
      app.innerHTML = `
        <div class="missing">
          <h1>Product not found</h1>
          <p class="summary">This product page does not exist yet.</p>
          <a class="button primary" href="index.html#products">Back to products</a>
        </div>
      `;
    }

    function renderProduct() {
      document.title = `${product.name} | North Peptides UK`;
      const options = product.variants.map((variant, index) => (
        `<option value="${index}">${variant.label} - ${money(variant.price)}</option>`
      )).join("");
      const detailItems = product.details.map(item => `<li>${item}</li>`).join("");
      const stripeButton = product.stripePaymentLink
        ? `<a class="button stripe" id="stripe-link" href="${product.stripePaymentLink}" rel="noopener" target="_blank">Pay by Card</a>`
        : `<span class="button stripe disabled">Stripe Link Soon</span>`;

      app.innerHTML = `
        <a class="back" href="index.html#products">← Back to products</a>
        <section class="grid">
          <div class="image-panel">
            <img src="${product.image}" alt="${product.name}">
          </div>
          <div class="info-panel">
            <div class="tag">${product.category}</div>
            <h1>${product.name}</h1>
            <p class="summary">${product.summary}</p>
            <div class="trust-row">
              <span class="trust-chip">UK stocked</span>
              <span class="trust-chip">Batch details on request</span>
              <span class="trust-chip">Research use only</span>
            </div>
            <ul class="details">${detailItems}</ul>
            <div class="buy-box">
              <label for="variant">Choose size</label>
              <select id="variant" onchange="updatePrice()">${options}</select>
              <div class="price-row">
                <div>
                  <div class="price-label">Selected price</div>
                  <div class="price" id="price">${money(product.variants[0].price)}</div>
                </div>
              </div>
              <div class="actions">
                <button class="primary" id="add-button" onclick="addDetailToBasket(false)">Add to Basket</button>
                <button class="primary" onclick="addDetailToBasket(true)">Add & Checkout</button>
                ${stripeButton}
              </div>
              <p class="note">Stripe Payment Links can be added per product in <code>product-data.js</code>. Until then, orders continue through basket and checkout review.</p>
            </div>
            <div class="research-box">
              <strong>Research use only.</strong> Products are not medicines, are not for human or animal consumption, and are supplied strictly for laboratory research purposes.
            </div>
          </div>
        </section>
      `;
    }

    if (!product) {
      renderMissing();
    } else {
      renderProduct();
    }
  </script>
</body>
</html>
