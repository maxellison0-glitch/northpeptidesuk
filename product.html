<body>
  <nav class="nav">
    <a href="index.html" class="logo">NORTH<span>PEPTIDES</span>UK</a>
    <div class="nav-links">
      <a href="index.html#products">Products</a>
      <a href="index.html#how-to-order">Order</a>
      <a href="lab-reports.html">Lab Reports</a>
      <a href="why-us.html">Why Us</a>
      <a href="mailto:orders@northpeptidesuk.com">Support</a>
      <a href="checkout.html" class="nav-basket"><span class="nav-basket-label">Basket </span><span class="nav-basket-count" id="nav-basket-count">0</span></a>
    </div>
  </nav>

  <main class="wrap" id="app"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("product") || "retatrutide";
    const product = PRODUCT_DATA[slug];
    const app = document.getElementById("app");

    function money(value) {
      return "£" + value;
    }

    function getBasket() {
      try {
        return JSON.parse(sessionStorage.getItem("npuk_basket") || "[]");
      } catch {
        return [];
      }
    }

    function saveBasket(basket) {
      sessionStorage.setItem("npuk_basket", JSON.stringify(basket));
    }

    function basketCount() {
      return getBasket().reduce((sum, item) => sum + item.qty, 0);
    }

    function updateBasketCount() {
      const count = document.getElementById("nav-basket-count");
      if (count) count.textContent = basketCount();
    }

    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
    }

    function selectedVariant() {
      const select = document.getElementById("variant");
      return product.variants[Number(select.value)];
    }

    function updatePrice() {
      const variant = selectedVariant();
      document.getElementById("price-now").textContent = money(variant.price);
    }

    function addItemToBasket(name, price, dose, qty = 1) {
      const quantity = Math.max(1, Math.min(Number.parseInt(qty, 10) || 1, 12));
      const basket = getBasket();
      const existing = basket.find(item => item.name === name && item.dose === dose);
      if (existing) {
        existing.qty += quantity;
      } else {
        basket.push({ name, price, dose, qty: quantity });
      }
      saveBasket(basket);
      updateBasketCount();
    }
    function selectedQuantity() {
      const el = document.getElementById("detail-qty");
      return Math.max(1, Math.min(Number.parseInt(el?.textContent, 10) || 1, 12));
    }
    function adjustDetailQty(delta) {
      const el = document.getElementById("detail-qty");
      if (!el) return;
      el.textContent = Math.max(1, Math.min(selectedQuantity() + delta, 12));
    }

    function addDetailToBasket(goCheckout = false) {
      const variant = selectedVariant();
      addItemToBasket(product.name, variant.price, variant.dose, selectedQuantity());
      if (goCheckout) {
        window.location.href = "checkout.html";
        return;
      }
      const button = document.getElementById("add-button");
      const followup = document.getElementById("checkout-followup");
      button.textContent = "Added";
      showToast(`${product.name} added to your basket`);
      if (followup) followup.classList.add("visible");
      setTimeout(() => { button.textContent = "Add to Basket"; }, 1200);
    }

    function addAddonToBasket(button, name, price) {
      addItemToBasket(name, price, "Accessory");
      button.textContent = "Added";
      showToast(`${name} added to your basket`);
      setTimeout(() => { button.textContent = "Add"; }, 1200);
    }

    function switchProductImg(wrap, src) {
      document.getElementById("main-product-img").src = src;
      document.querySelectorAll(".img-thumb-wrap").forEach(t => t.classList.remove("active"));
      wrap.classList.add("active");
    }

    function addIntranasalToBasket(btn) {
      addItemToBasket("Intranasal Research Kit", 4.99, "Kit add-on");
      btn.textContent = "Added ✓";
      btn.classList.add("added");
      showToast("Intranasal Research Kit added to basket");
    }

    function addPenToBasket(btn) {
      addItemToBasket("Disposable Research Pen Kit", 9.99, "Kit add-on");
      btn.textContent = "Added ✓";
      btn.classList.add("added");
      showToast("Research Pen Kit added to basket");
    }

    function renderMissing() {
      app.innerHTML = `
        <div class="missing">
          <h1>Product not found</h1>
          <p class="summary">This product page does not exist yet.</p>
          <a class="button primary" href="index.html#products">Back to products</a>
        </div>
      `;
    }

    const SITE_ORIGIN = "https://northpeptidesuk.com";

    function setMeta(attr, key, content) {
      let el = document.head.querySelector(`meta[${attr}="${key}"]`);
      if (!el) {
        el = document.createElement("meta");
        el.setAttribute(attr, key);
        document.head.appendChild(el);
      }
      el.setAttribute("content", content);
    }

    function injectSEO() {
      const seo = product.seo || {};
      const canonicalUrl = `${SITE_ORIGIN}/product.html?product=${slug}`;
      const title = seo.title || `${product.name} | UK Research Peptide | North Peptides UK`;
      const lowestPrice = Math.min(...product.variants.map(v => v.price));
      const desc = (seo.metaDescription
        || `${product.summary} UK stocked, 99%+ purity, 24h dispatch. From £${lowestPrice}. Research use only.`).slice(0, 158);
      const imageUrl = `${SITE_ORIGIN}/${product.image}`;

      document.title = title;

      let canonical = document.head.querySelector('link[rel="canonical"]');
      if (!canonical) {
        canonical = document.createElement("link");
        canonical.rel = "canonical";
        document.head.appendChild(canonical);
      }
      canonical.href = canonicalUrl;

      setMeta("name", "description", desc);
      setMeta("property", "og:type", "product");
      setMeta("property", "og:title", title);
      setMeta("property", "og:description", desc);
      setMeta("property", "og:url", canonicalUrl);
      setMeta("property", "og:image", imageUrl);
      setMeta("property", "og:site_name", "North Peptides UK");
      setMeta("name", "twitter:card", "summary_large_image");
      setMeta("name", "twitter:title", title);
      setMeta("name", "twitter:description", desc);
      setMeta("name", "twitter:image", imageUrl);

      const offers = product.variants.map(v => ({
        "@type": "Offer",
        "name": `${product.name} ${v.dose}`,
        "price": String(v.price),
        "priceCurrency": "GBP",
        "availability": "https://schema.org/InStock",
        "itemCondition": "https://schema.org/NewCondition",
        "url": canonicalUrl
      }));
      const graph = [
        {
          "@type": "Product",
          "name": product.name,
          "description": (Array.isArray(product.longDescription) && product.longDescription.length)
            ? product.longDescription.join(" ").slice(0, 5000)
            : product.summary,
          "image": imageUrl,
          "category": product.category,
          "brand": { "@type": "Brand", "name": "North Peptides UK" },
          "offers": offers
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": SITE_ORIGIN + "/" },
            { "@type": "ListItem", "position": 2, "name": product.category, "item": SITE_ORIGIN + "/#products" },
            { "@type": "ListItem", "position": 3, "name": product.name, "item": canonicalUrl }
          ]
        }
      ];
      if (Array.isArray(seo.faq) && seo.faq.length) {
        graph.push({
          "@type": "FAQPage",
          "mainEntity": seo.faq.map(f => ({
            "@type": "Question",
            "name": f.q,
            "acceptedAnswer": { "@type": "Answer", "text": f.a }
          }))
        });
      }
      let ldScript = document.getElementById("product-jsonld");
      if (!ldScript) {
        ldScript = document.createElement("script");
        ldScript.type = "application/ld+json";
        ldScript.id = "product-jsonld";
        document.head.appendChild(ldScript);
      }
      ldScript.textContent = JSON.stringify({ "@context": "https://schema.org", "@graph": graph });
    }

    function renderProduct() {
      injectSEO();
      const options = product.variants.map((variant, index) => (
        `<option value="${index}">${variant.label} - ${money(variant.price)}</option>`
      )).join("");
      const detailItems = product.details.map(item => `<li>${item}</li>`).join("");
      const firstVariant = product.variants[0];
      const trust = product.trust || {
        items: [
          ["Purity", "99%+ Stated"],
          ["Form", "Lyophilised"],
          ["Storage", "Frozen"],
          ["Dispatch", "Within 24h"],
          ["Batch Details", "On Request"],
          ["Use", "Research Only"]
        ],
        chips: ["Purity Stated", "UK Stocked", "Stored Frozen", "Batch Details Available"]
      };
      const isSupply = Boolean(product.supply);
      const trustItems = trust.items.map(([label, value], index) => (
        `<div class="tp-item"><span class="tp-label">${label}</span><span class="tp-value ${!isSupply && index === 0 ? "tp-v-purity" : ""} ${label === "Use" ? "tp-v-research" : ""}">${value}</span></div>`
      )).join("");
      const trustChips = trust.chips.map((chip, index) => `<span class="tp-chip ${!isSupply && index === 0 ? "tp-chip-purity" : ""}">${chip}</span>`).join("");
      const relatedSupplies = (isSupply || slug.endsWith('-pen')) ? "" : `
            <div class="also-need">
              <div class="also-need-title">You may also need</div>
              <div class="addon-row">
                <div class="addon-card">
                  <div><span class="addon-name">Bacteriostatic Water</span><span class="addon-price">£6.99</span></div>
                  <button class="addon-btn" type="button" onclick="addAddonToBasket(this, 'Bacteriostatic Water', 6.99)">Add</button>
                </div>
                <div class="addon-card">
                  <div><span class="addon-name">Insulin Needle Pack</span><span class="addon-price">£6.99</span></div>
                  <button class="addon-btn" type="button" onclick="addAddonToBasket(this, 'Insulin Needle Pack', 6.99)">Add</button>
                </div>
              </div>
            </div>`;
      const thumbs = product.secondaryImage ? `
            <div class="img-thumbs">
              <div class="img-thumb-wrap active" onclick="switchProductImg(this,'${product.image}')">
                <img src="${product.image}" alt="${product.name}">
              </div>
              <div class="img-thumb-wrap" onclick="switchProductImg(this,'${product.secondaryImage}')">
                <img src="${product.secondaryImage}" alt="${product.name} research kit">
              </div>
            </div>` : "";
      const intranasalSection = product.intranasalAddon ? `
            <div class="intranasal-box">
              <span class="intranasal-box-label">Research Kit Add-on</span>
              <div class="intranasal-box-heading">Make this a research kit</div>
              <p class="intranasal-box-desc">Add an Intranasal Research Kit with sterile saline, 10ml nasal spray bottle, transfer syringe, alcohol wipes, and label.</p>
              <button class="intranasal-box-btn" type="button" onclick="addIntranasalToBasket(this)">Add Intranasal Research Kit — +£4.99</button>
            </div>` : "";
      const sisterSection = product.sisterProduct ? (
        product.sisterProduct.slug.endsWith('-pen')
          ? `<div class="upgrade-card">
              <span class="upgrade-card-label">Pen-Ready Upgrade</span>
              <div class="upgrade-card-body">
                <div>
                  <div class="upgrade-card-heading">Skip the reconstitution</div>
                  <p class="upgrade-card-desc">Get this compound pre-reconstituted in a universal pen-compatible vial — just load and go. No measuring, no mixing.</p>
                </div>
                <a class="upgrade-card-btn" href="product.html?product=${product.sisterProduct.slug}">View Pen Vial →</a>
              </div>
            </div>`
          : `<a class="sister-link" href="product.html?product=${product.sisterProduct.slug}">
              <div>
                <div class="sister-link-label">${product.sisterProduct.label}</div>
                <div class="sister-link-name">${product.sisterProduct.name}</div>
              </div>
              <span class="sister-link-arrow">→</span>
            </a>`
      ) : "";
      const penSection = slug.endsWith('-pen') ? `
            <div class="pen-box">
              <span class="pen-box-label">Compatible Add-on</span>
              <div class="pen-box-inner">
                <img class="pen-box-img" src="research-pen-kit-style.png" alt="Disposable injection pen">
                <div class="pen-box-body">
                  <div class="pen-box-heading">This vial fits any auto-injector pen</div>
                  <p class="pen-box-desc">Already have a pen? You're set — just load this vial. Need one? Add a disposable single-use pen + 10 sterile needle tips to your order.</p>
                  <button class="pen-box-btn" type="button" onclick="addPenToBasket(this)">Add Disposable Injection Pen — +£9.99</button>
                </div>
              </div>
            </div>` : "";
      const faqSection = (product.seo && Array.isArray(product.seo.faq) && product.seo.faq.length) ? `
            <div class="pd-section faq-section">
              <div class="pd-eyebrow">Questions</div>
              <h2 class="pd-h2">Frequently asked questions</h2>
              ${product.seo.faq.map(f => `
              <details class="faq-item">
                <summary>${f.q}</summary>
                <p>${f.a}</p>
              </details>`).join("")}
            </div>` : "";

      // --- Lower full-width content (enriched, research-framed descriptions) ---
      const descSection = (Array.isArray(product.longDescription) && product.longDescription.length) ? `
            <div class="pd-section pd-desc">
              <div class="pd-eyebrow">Overview</div>
              <h2 class="pd-h2">About ${product.name}</h2>
              ${product.longDescription.map(p => `<p>${p}</p>`).join("")}
            </div>` : "";

      const specsSection = (Array.isArray(product.specs) && product.specs.length) ? `
            <div class="pd-section">
              <div class="pd-eyebrow">Specifications</div>
              <h2 class="pd-h2">Technical specifications</h2>
              <table class="spec-table">
                ${product.specs.map(([label, value]) => `<tr><th>${label}</th><td class="${/purity/i.test(label) ? "spec-purity" : ""}">${value}</td></tr>`).join("")}
              </table>
            </div>` : "";

      const researchAreasSection = (Array.isArray(product.researchAreas) && product.researchAreas.length) ? `
            <div class="pd-section">
              <div class="pd-eyebrow">Research context</div>
              <h2 class="pd-h2">Areas of research interest</h2>
              <ul class="research-areas">
                ${product.researchAreas.map(a => `<li>${a}</li>`).join("")}
              </ul>
              <!--compliance:ignore-start-->
              <p class="pd-note">The points above summarise published laboratory and preclinical research only. They are not statements of any effect in humans or animals. This product is supplied strictly for research use only and is not for human or animal consumption.</p>
              <!--compliance:ignore-end-->
            </div>` : "";

      const storageSection = product.storage ? `
            <div class="pd-section pd-desc">
              <div class="pd-eyebrow">Handling</div>
              <h2 class="pd-h2">Storage &amp; handling</h2>
              ${(Array.isArray(product.storage) ? product.storage : [product.storage]).map(p => `<p>${p}</p>`).join("")}
            </div>` : "";

      const lowerContent = [descSection, specsSection, researchAreasSection, storageSection, faqSection].filter(Boolean).join("");
      const lowerSection = lowerContent ? `<section class="pd-lower">${lowerContent}</section>` : "";

      app.innerHTML = `
        <a class="back" href="index.html#products">← Back to products</a>
        <section class="grid">
          <div class="image-panel">
            <img src="${product.image}" alt="${product.name}" id="main-product-img" class="main-product-img">
            ${thumbs}
          </div>
          <div class="info-panel">
            <div class="tag">${product.category}</div>
            <h1>${product.name}</h1>
            <p class="summary">${product.summary}</p>
            <div class="trust-panel ${isSupply ? "supply-trust" : ""}">
              <div class="tp-grid">
                ${trustItems}
              </div>
              <div class="tp-chips">
                ${trustChips}
              </div>
            </div>
            <ul class="details">${detailItems}</ul>
            <div class="buy-box">
              <label for="variant">${isSupply ? "Choose option" : "Choose size"}</label>
              <select id="variant" onchange="updatePrice()">${options}</select>
              <div class="price-row">
                <span class="price-now" id="price-now">${money(firstVariant.price)}</span>
              </div>
              <div class="qty-row">
                <label>Quantity</label>
                <div class="qty-control">
                  <button class="qty-btn" type="button" onclick="adjustDetailQty(-1)">−</button>
                  <span class="qty-value" id="detail-qty">1</span>
                  <button class="qty-btn" type="button" onclick="adjustDetailQty(1)">+</button>
                </div>
              </div>
              <div class="actions">
                <button class="primary" id="add-button" onclick="addDetailToBasket(false)">Add to Basket</button>
                <a class="button checkout-followup" id="checkout-followup" href="checkout.html">Continue to Checkout</a>
              </div>
            </div>
            ${intranasalSection}
            ${penSection}
            ${sisterSection}
            <div class="research-box">
              <strong>Research use only.</strong> Products are not medicines, are not for human or animal consumption, and are supplied strictly for laboratory research purposes.
            </div>
            ${relatedSupplies}
          </div>
        </section>
        ${lowerSection}
      `;
    }

    if (!product) {
      renderMissing();
    } else {
      renderProduct();
      updateBasketCount();
    }
  </script>
