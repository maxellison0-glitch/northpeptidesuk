<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | North Peptides UK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="product-data.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, sans-serif; background: #080A0F; color: #F4F4F0; }
    a { color: inherit; }
    .nav { height: 62px; padding: 0 40px; background: #101010; color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .logo { font-family: Syne, sans-serif; font-weight: 800; font-size: 1rem; letter-spacing: 0.08em; text-decoration: none; }
    .logo span { color: #00A67E; }
    .nav-links { display: flex; align-items: center; gap: 18px; font-family: "DM Mono", monospace; font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .nav-links a { color: rgba(255,255,255,0.75); text-decoration: none; }
    .nav-links a:hover { color: #fff; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 42px 40px 70px; }
    .back { display: inline-block; margin-bottom: 24px; font-family: "DM Mono", monospace; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(244,244,240,0.58); text-decoration: none; }
    .back:hover { color: #00E5A0; }
    .grid { display: grid; grid-template-columns: minmax(300px, 0.9fr) minmax(360px, 1.1fr); gap: 38px; align-items: start; }
    .image-panel { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; }
    .image-panel img { width: 100%; aspect-ratio: 1; display: block; object-fit: cover; background: rgba(255,255,255,0.04); }
    .info-panel { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 28px; }
    .tag { font-family: "DM Mono", monospace; font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: #00A67E; margin-bottom: 12px; }
    h1 { font-family: Syne, sans-serif; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1; margin-bottom: 14px; }
    .summary { color: rgba(244,244,240,0.68); line-height: 1.7; max-width: 620px; margin-bottom: 22px; }
    .trust-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .trust-chip { border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.045); border-radius: 999px; padding: 7px 11px; font-family: "DM Mono", monospace; font-size: 0.58rem; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(244,244,240,0.7); }
    .details { margin: 0 0 24px; padding-left: 18px; color: rgba(244,244,240,0.74); line-height: 1.8; font-size: 0.9rem; }
    .details li::marker { color: #00E5A0; }
    .buy-box { border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 22px; background: rgba(255,255,255,0.04); }
    label { display: block; font-family: "DM Mono", monospace; font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(244,244,240,0.58); margin-bottom: 8px; }
    select { width: 100%; min-height: 46px; border: 1px solid rgba(255,255,255,0.12); border-radius: 7px; background: #10151C; color: #F4F4F0; padding: 0 13px; font: 500 0.85rem "DM Mono", monospace; margin-bottom: 18px; }
    .price-row { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .price-was { color: rgba(244,244,240,0.42); text-decoration: line-through; font: 600 1rem Inter, sans-serif; }
    .price-now { color: #ffffff; font-family: Syne, sans-serif; font-size: 2.35rem; font-weight: 800; line-height: 1; }
    .price-save { border-radius: 999px; background: rgba(0,229,160,0.14); color: #00E5A0; padding: 6px 10px; font-family: "DM Mono", monospace; font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .actions { display: grid; grid-template-columns: 1fr; gap: 10px; }
    button, .button { border: 0; border-radius: 7px; min-height: 54px; padding: 0 16px; cursor: pointer; font-family: "DM Mono", monospace; font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
    .primary { background: #00E5A0; color: #06120f; font-weight: 800; }
    .primary:hover { background: #25f2b2; }
    .checkout-followup { display: none; background: rgba(255,255,255,0.07); color: #F4F4F0; border: 1px solid rgba(255,255,255,0.12); }
    .checkout-followup.visible { display: inline-flex; }
    .research-box { margin-top: 24px; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 15px; background: rgba(255,255,255,0.04); color: rgba(244,244,240,0.68); font-size: 0.78rem; line-height: 1.7; }
    .research-box strong { color: #F4F4F0; }
    .also-need { margin-top: 16px; }
    .also-need-title { margin-bottom: 10px; font-family: "DM Mono", monospace; font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(244,244,240,0.58); }
    .addon-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .addon-card { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 62px; padding: 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; background: rgba(255,255,255,0.035); }
    .addon-name { display: block; color: #F4F4F0; font-size: 0.82rem; font-weight: 700; }
    .addon-price { display: block; margin-top: 3px; color: rgba(244,244,240,0.58); font-family: "DM Mono", monospace; font-size: 0.68rem; }
    .addon-btn { min-height: 34px; padding: 0 12px; border-radius: 5px; background: rgba(0,229,160,0.14); color: #00E5A0; border: 1px solid rgba(0,229,160,0.28); font-size: 0.62rem; flex-shrink: 0; }
    .addon-btn:hover { background: #00E5A0; color: #06120f; }
    .missing { max-width: 680px; margin: 80px auto; text-align: center; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 34px; }
    .missing h1 { font-size: 2rem; }
    @media (max-width: 760px) {
      .nav { padding: 0 18px; }
      .nav-links { gap: 10px; font-size: 0.56rem; }
      .wrap { padding: 28px 16px 52px; }
      .grid { grid-template-columns: 1fr; gap: 18px; }
      .info-panel { padding: 20px; }
      .addon-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="logo">NORTH<span>PEPTIDES</span>UK</a>
    <div class="nav-links">
      <a href="index.html#products">Shop</a>
      <a href="checkout.html">Checkout</a>
      <a href="mailto:support@northpeptidesuk.com">Support</a>
    </div>
  </nav>

  <main class="wrap" id="app"></main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("product") || "retatrutide";
    const product = PRODUCT_DATA[slug];
    const app = document.getElementById("app");

    function money(value) {
      return "£" + value;
    }

    function getBasket() {
      try {
        return JSON.parse(sessionStorage.getItem("npuk_basket") || "[]");
      } catch {
        return [];
      }
    }

    function saveBasket(basket) {
      sessionStorage.setItem("npuk_basket", JSON.stringify(basket));
    }

    function selectedVariant() {
      const select = document.getElementById("variant");
      return product.variants[Number(select.value)];
    }

    function discountFor(variant) {
      return variant.was ? Math.max(variant.was - variant.price, 0) : 5;
    }

    function wasPriceFor(variant) {
      return variant.was || variant.price + discountFor(variant);
    }

    function updatePrice() {
      const variant = selectedVariant();
      document.getElementById("price-was").textContent = money(wasPriceFor(variant));
      document.getElementById("price-now").textContent = money(variant.price);
      document.getElementById("price-save").textContent = `Save ${money(discountFor(variant))}`;
    }

    function addItemToBasket(name, price, dose) {
      const basket = getBasket();
      const existing = basket.find(item => item.name === name && item.dose === dose);
      if (existing) {
        existing.qty += 1;
      } else {
        basket.push({ name, price, dose, qty: 1 });
      }
      saveBasket(basket);
    }

    function addDetailToBasket(goCheckout = false) {
      const variant = selectedVariant();
      addItemToBasket(product.name, variant.price, variant.dose);
      if (goCheckout) {
        window.location.href = "checkout.html";
        return;
      }
      const button = document.getElementById("add-button");
      const followup = document.getElementById("checkout-followup");
      button.textContent = "Added";
      if (followup) followup.classList.add("visible");
      setTimeout(() => { button.textContent = "Add to Basket"; }, 1200);
    }

    function addAddonToBasket(button, name, price) {
      addItemToBasket(name, price, "Accessory");
      button.textContent = "Added";
      setTimeout(() => { button.textContent = "Add"; }, 1200);
    }

    function renderMissing() {
      app.innerHTML = `
        <div class="missing">
          <h1>Product not found</h1>
          <p class="summary">This product page does not exist yet.</p>
          <a class="button primary" href="index.html#products">Back to products</a>
        </div>
      `;
    }

    function renderProduct() {
      document.title = `${product.name} | North Peptides UK`;
      const options = product.variants.map((variant, index) => (
        `<option value="${index}">${variant.label} - ${money(variant.price)}</option>`
      )).join("");
      const detailItems = product.details.map(item => `<li>${item}</li>`).join("");
      const firstVariant = product.variants[0];
      app.innerHTML = `
        <a class="back" href="index.html#products">← Back to products</a>
        <section class="grid">
          <div class="image-panel">
            <img src="${product.image}" alt="${product.name}">
          </div>
          <div class="info-panel">
            <div class="tag">${product.category}</div>
            <h1>${product.name}</h1>
            <p class="summary">${product.summary}</p>
            <div class="trust-row">
              <span class="trust-chip">UK stocked</span>
              <span class="trust-chip">Batch details on request</span>
              <span class="trust-chip">Research use only</span>
            </div>
            <ul class="details">${detailItems}</ul>
            <div class="buy-box">
              <label for="variant">Choose size</label>
              <select id="variant" onchange="updatePrice()">${options}</select>
              <div class="price-row">
                <span class="price-was" id="price-was">${money(wasPriceFor(firstVariant))}</span>
                <span class="price-now" id="price-now">${money(firstVariant.price)}</span>
                <span class="price-save" id="price-save">Save ${money(discountFor(firstVariant))}</span>
              </div>
              <div class="actions">
                <button class="primary" id="add-button" onclick="addDetailToBasket(false)">Add to Basket</button>
                <a class="button checkout-followup" id="checkout-followup" href="checkout.html">Continue to Checkout</a>
              </div>
            </div>
            <div class="research-box">
              <strong>Research use only.</strong> Products are not medicines, are not for human or animal consumption, and are supplied strictly for laboratory research purposes.
            </div>
            <div class="also-need">
              <div class="also-need-title">You may also need</div>
              <div class="addon-row">
                <div class="addon-card">
                  <div><span class="addon-name">Bacteriostatic Water</span><span class="addon-price">£7</span></div>
                  <button class="addon-btn" type="button" onclick="addAddonToBasket(this, 'Bacteriostatic Water', 7)">Add</button>
                </div>
                <div class="addon-card">
                  <div><span class="addon-name">Syringe Kit</span><span class="addon-price">£9</span></div>
                  <button class="addon-btn" type="button" onclick="addAddonToBasket(this, 'Syringe Kit', 9)">Add</button>
                </div>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    if (!product) {
      renderMissing();
    } else {
      renderProduct();
    }
  </script>
</body>
</html>
